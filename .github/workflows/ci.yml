name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消进行中的旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 · Lint · 测试 · 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier 格式检查
        run: npm run format:check

      - name: 单元测试（乐理与声学回归）
        run: npm test

      - name: 构建
        run: npm run build
